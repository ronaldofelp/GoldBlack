name: CI — Testes do backend

# Dispara em todo push e em pull requests para a main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # todos os steps rodam dentro de backend/

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest

      - name: Rodar testes
        run: pytest tests/ -v --tb=short
        # APP_ENV=test já é setado pelo conftest.py antes de qualquer import.
        # Os testes usam SQLite em memória — sem Oracle, sem wallet, sem segredos.
