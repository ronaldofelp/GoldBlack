name: CI/CD — GoldBlack Coffee

# Testes: todo push e PR na main.
# Deploy: apenas push direto na main (não em PRs), e só se os testes passarem.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Princípio do menor privilégio: o workflow só precisa ler o código.
# Nenhum job escreve no repositório — contents: write seria excessivo.
permissions:
  contents: read

env:
  REGISTRY:  vcp.ocir.io
  NAMESPACE: ax52rtggbppy

jobs:
  # ── Job 1: testes ────────────────────────────────────────────────────────────
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt pytest

      - name: Rodar testes
        run: pytest tests/ -v --tb=short
        # APP_ENV=test setado pelo conftest.py — sem Oracle, sem wallet, sem segredos.

  # ── Job 2: build + deploy ────────────────────────────────────────────────────
  deploy:
    name: Build e deploy na VM OCI
    runs-on: ubuntu-latest
    needs: test                          # só executa se os testes passarem
    if: github.event_name == 'push'      # nunca roda em PRs — só em push direto

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login no OCIR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USER }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Build e push — backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/goldblack-backend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max   # cache de camadas entre runs (acelera builds)

      - name: Build e push — frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/goldblack-frontend:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Deploy na VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host:        ${{ secrets.VM_HOST }}
          username:    ubuntu
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          # Verifica o fingerprint do host para prevenir MITM caso o IP mude de mãos.
          # Gere o valor com: ssh-keyscan -t ed25519 <IP> | ssh-keygen -lf -
          # e armazene o resultado (SHA256:...) como secret SSH_HOST_FINGERPRINT.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: OCIR_USER,OCIR_TOKEN,REGISTRY,NAMESPACE
          script: |
            # Re-autentica no OCIR para garantir que o pull funciona
            echo "$OCIR_TOKEN" | sudo docker login "$REGISTRY" \
              --username "$OCIR_USER" --password-stdin

            cd ~/goldblack

            # Baixa as imagens novas e recria os containers afetados
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            sudo docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --force-recreate

            # Remove imagens antigas para não encher o disco
            sudo docker image prune -f
        env:
          OCIR_USER:  ${{ secrets.OCIR_USER }}
          OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}
